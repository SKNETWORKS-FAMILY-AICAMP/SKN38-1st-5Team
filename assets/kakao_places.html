<section class="kakao-places" aria-label="주차장·충전소 위치와 이용 안내">
  <div class="kp-toolbar">
    <label>지도에서 장소 선택 <select class="kp-choice" aria-label="지도에서 장소 선택"><option value="">장소를 선택해 주세요</option></select></label>
    <button class="kp-motion kp-button" type="button" hidden>깜빡임 끄기</button>
  </div>
  <p class="kp-status" role="status">지도를 불러오는 중이에요.</p>
  <button class="kp-retry kp-button" type="button" hidden>지도 다시 불러오기</button>
  <div class="kp-map" role="region" aria-label="주차장·충전소 지도. P는 주차장, ⚡는 충전소예요."></div>
  <p class="kp-legend">P 공영·민영·기타 주차장 · ⚡ 충전소 · 테두리와 ‘반경 안’ 표시는 역에서 가까운 시설이에요. 묶음 숫자는 시설 수예요.</p>
  <section class="kp-detail" aria-live="polite">핀이나 장소 목록을 선택하면 이용시간과 요금을 확인할 수 있어요. 좌표가 없는 시설은 아래 표에서 확인해 주세요.</section>
  <section class="kp-roadview-panel" aria-label="선택한 시설 주변 로드뷰" hidden>
    <button class="kp-roadview-close kp-button" type="button">로드뷰 닫기</button>
    <p class="kp-roadview-status" role="status"></p>
    <div class="kp-roadview" role="region" aria-label="카카오 로드뷰"></div>
  </section>
</section>
